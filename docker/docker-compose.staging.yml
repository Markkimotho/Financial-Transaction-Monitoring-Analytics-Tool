version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: financial_monitoring_postgres
    environment:
      POSTGRES_DB: financial_monitoring
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financial_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: financial_monitoring_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financial_network

  # Django Application
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    container_name: financial_monitoring_web
    command: python src/manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "your-insecure-dev-key-change-in-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      
      # Database
      DB_ENGINE: "django.db.backends.postgresql_psycopg2"
      DB_NAME: "financial_monitoring"
      DB_USER: "financial_user"
      DB_PASSWORD: "financial_password"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      
      # Redis
      REDIS_URL: "redis://redis:6379/1"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      
      # Security (development settings)
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      
      # CORS
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000,http://localhost:8001"
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - financial_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Celery Worker for async tasks
  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    container_name: financial_monitoring_celery
    command: celery -A core worker -l info
    volumes:
      - ..:/app
    environment:
      DEBUG: "True"
      SECRET_KEY: "your-insecure-dev-key-change-in-production"
      
      # Database
      DB_ENGINE: "django.db.backends.postgresql_psycopg2"
      DB_NAME: "financial_monitoring"
      DB_USER: "financial_user"
      DB_PASSWORD: "financial_password"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      
      # Redis
      REDIS_URL: "redis://redis:6379/1"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    
    depends_on:
      - web
      - postgres
      - redis
    networks:
      - financial_network

  # Optional: Celery Beat for scheduled tasks
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    container_name: financial_monitoring_celery_beat
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ..:/app
    environment:
      DEBUG: "True"
      SECRET_KEY: "your-insecure-dev-key-change-in-production"
      
      # Database
      DB_ENGINE: "django.db.backends.postgresql_psycopg2"
      DB_NAME: "financial_monitoring"
      DB_USER: "financial_user"
      DB_PASSWORD: "financial_password"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      
      # Redis
      REDIS_URL: "redis://redis:6379/1"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    
    depends_on:
      - web
      - postgres
      - redis
    networks:
      - financial_network

volumes:
  postgres_data:
  redis_data:

networks:
  financial_network:
    driver: bridge
